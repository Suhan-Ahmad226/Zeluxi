name: CI

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zelux
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/zelux
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      DEFAULT_COURIER_PROVIDER: MANUAL
      DEFAULT_PAYMENT_PROVIDER: MANUAL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prisma@6.19.3 validate --schema=./prisma/schema.prisma
      - run: npx prisma@6.19.3 generate --schema=./prisma/schema.prisma
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
