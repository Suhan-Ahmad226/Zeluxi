name: Supabase Database Migrations

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zeluxi-supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Supabase migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Check required secret
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Add SUPABASE_DB_URL in GitHub repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Verify Supabase project target
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          node --input-type=module <<'NODE'
          const expectedProjectRef = 'djffhkevocxlyhqvymiw';
          const url = new URL(process.env.SUPABASE_DB_URL);
          const username = decodeURIComponent(url.username);
          const hostMatch = url.hostname.match(/^db\.([a-z0-9]+)\.supabase\.co$/i);
          const userMatch = username.match(/^postgres\.([a-z0-9]+)$/i);
          const actualProjectRef = hostMatch?.[1] || userMatch?.[1];
          if (!actualProjectRef) {
            console.error('Could not verify Supabase project ref from the database host or pooler username.');
            process.exit(1);
          }
          if (actualProjectRef !== expectedProjectRef) {
            console.error('Migration blocked: SUPABASE_DB_URL targets a different Supabase project.');
            process.exit(1);
          }
          console.log('Supabase migration target verified.');
          NODE

      - name: Apply migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npx --yes supabase@latest db push --db-url "$SUPABASE_DB_URL" --yes
